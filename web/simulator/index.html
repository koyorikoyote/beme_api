<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEME Chat Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Roboto", Arial, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #212121;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    #ws-status {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
      margin-left: auto;
    }
    #ws-status.connecting { background: #555; color: #ccc; }
    #ws-status.connected  { background: #1a6b1a; color: #7fff7f; }
    #ws-status.disconnected { background: #6b1a1a; color: #ff9090; }

    .panels {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 1px;
      background: #333;
    }

    .panel {
      display: flex;
      flex-direction: column;
      background: #0f0f0f;
      flex: 1;
    }

    .panel-header {
      background: #212121;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #333;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      scroll-behavior: smooth;
    }

    /* YouTube-style chat message */
    .chat-msg {
      padding: 4px 12px;
      font-size: 13px;
      line-height: 1.4;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }
    .chat-msg:hover { background: #1a1a1a; }
    .chat-msg .author {
      font-weight: 600;
      color: #3ea6ff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chat-msg .text { color: #e0e0e0; word-break: break-word; }

    /* AI Actions tip card */
    .tip-card {
      margin: 8px 10px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-left: 3px solid #3ea6ff;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
    }
    .tip-card .tc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .tip-card .tc-type {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #3ea6ff;
      background: #0d1b2a;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tip-card .tc-score {
      font-size: 11px;
      color: #aaa;
    }
    .tip-card .tc-score span {
      color: #7fff7f;
      font-weight: 600;
    }
    .tip-card .tc-message {
      color: #e0e0e0;
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .tip-card .tc-expert {
      font-size: 11px;
      color: #888;
    }
    .tip-card .tc-expert strong { color: #3ea6ff; }
    .tip-card .tc-time {
      font-size: 10px;
      color: #555;
      margin-top: 4px;
    }

    .empty-state {
      padding: 24px 12px;
      text-align: center;
      color: #555;
      font-size: 13px;
    }

    /* Form */
    .form-area {
      background: #212121;
      border-top: 1px solid #333;
      padding: 12px 16px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 11px;
      color: #888;
      font-weight: 500;
    }
    .form-group input {
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: #3ea6ff; }

    #input-name { width: 160px; }
    #input-score { width: 80px; }
    #input-message { flex: 1; }

    .send-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    button[type="submit"] {
      background: #3ea6ff;
      color: #0f0f0f;
      border: none;
      border-radius: 4px;
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button[type="submit"]:hover { background: #65b8ff; }
    button[type="submit"]:active { background: #2a8fe0; }

    /* Scrollbar */
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>🎮 BEME Chat Simulator</h1>
  <span id="ws-status" class="connecting">⬤ Connecting…</span>
</header>

<div class="panels">
  <!-- Left: YouTube-style chat -->
  <div class="panel">
    <div class="panel-header">💬 Live Chat</div>
    <div class="messages" id="chat-window">
      <div class="empty-state">No messages yet. Send one below!</div>
    </div>
  </div>

  <!-- Right: AI Actions -->
  <div class="panel">
    <div class="panel-header">🤖 AI Actions</div>
    <div class="messages" id="ai-panel">
      <div class="empty-state">Tip Cards will appear here when the AI processes messages.</div>
    </div>
  </div>
</div>

<div class="form-area">
  <form id="chat-form" autocomplete="off">
    <div class="form-row">
      <div class="form-group">
        <label for="input-name">Display Name</label>
        <input id="input-name" type="text" placeholder="YourName" value="Viewer1" required />
      </div>
      <div class="form-group">
        <label for="input-score">Score (0–100)</label>
        <input id="input-score" type="number" min="0" max="100" placeholder="50" value="50" required />
      </div>
    </div>
    <div class="send-row">
      <div class="form-group" style="flex:1">
        <label for="input-message">Message</label>
        <input id="input-message" type="text" placeholder="Type a chat message…" required />
      </div>
      <button type="submit">Send</button>
    </div>
  </form>
</div>

<script>
  // ── Utilities ──────────────────────────────────────────────────────────────

  function slugify(name) {
    return name.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
  }

  function scrollToBottom(el) {
    el.scrollTop = el.scrollHeight;
  }

  function clearEmptyState(el) {
    const empty = el.querySelector('.empty-state');
    if (empty) empty.remove();
  }

  function formatTime(isoStr) {
    try {
      return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch {
      return '';
    }
  }

  // ── Chat window ────────────────────────────────────────────────────────────

  function appendChatMessage(displayName, text) {
    const win = document.getElementById('chat-window');
    clearEmptyState(win);

    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span class="author">${escHtml(displayName)}:</span><span class="text">${escHtml(text)}</span>`;
    win.appendChild(div);
    scrollToBottom(win);
  }

  // ── AI Actions panel ───────────────────────────────────────────────────────

  function appendTipCard(payload, timestamp) {
    const panel = document.getElementById('ai-panel');
    clearEmptyState(panel);

    const sentimentPct = typeof payload.sentiment_score === 'number'
      ? (payload.sentiment_score * 100).toFixed(0) + '%'
      : '—';

    const card = document.createElement('div');
    card.className = 'tip-card';
    card.innerHTML = `
      <div class="tc-header">
        <span class="tc-type">${escHtml(payload.tip_type || 'tip')}</span>
        <span class="tc-score">Sentiment: <span>${sentimentPct}</span></span>
      </div>
      <div class="tc-message">${escHtml(payload.message || '')}</div>
      <div class="tc-expert">Expert: <strong>${escHtml(payload.expert_handle || 'unknown')}</strong></div>
      ${timestamp ? `<div class="tc-time">${formatTime(timestamp)}</div>` : ''}
    `;
    panel.appendChild(card);
    scrollToBottom(panel);
  }

  // ── HTML escaping ──────────────────────────────────────────────────────────

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────

  const wsStatusEl = document.getElementById('ws-status');

  function setWsStatus(state) {
    wsStatusEl.className = state;
    const labels = { connecting: '⬤ Connecting…', connected: '⬤ Connected', disconnected: '⬤ Disconnected' };
    wsStatusEl.textContent = labels[state] || state;
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws/hud`);

    ws.addEventListener('open', () => setWsStatus('connected'));

    ws.addEventListener('message', (event) => {
      let envelope;
      try { envelope = JSON.parse(event.data); } catch { return; }

      if (envelope.type === 'tip_card' && envelope.payload) {
        appendTipCard(envelope.payload, envelope.timestamp);
      }
    });

    ws.addEventListener('close', () => {
      setWsStatus('disconnected');
      // Reconnect after 3 seconds
      setTimeout(connectWS, 3000);
    });

    ws.addEventListener('error', () => {
      setWsStatus('disconnected');
    });
  }

  connectWS();

  // ── Form submit ────────────────────────────────────────────────────────────

  document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const displayName = document.getElementById('input-name').value.trim();
    const score       = parseInt(document.getElementById('input-score').value, 10);
    const content     = document.getElementById('input-message').value.trim();

    if (!displayName || !content) return;

    const viewerId = slugify(displayName) || 'viewer';

    const body = {
      viewer_id:          viewerId,
      display_name:       displayName,
      content:            content,
      contribution_score: isNaN(score) ? 0 : Math.min(100, Math.max(0, score)),
    };

    // Optimistically add to chat window
    appendChatMessage(displayName, content);
    document.getElementById('input-message').value = '';

    try {
      const res = await fetch('/api/chat', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        console.warn('Chat API error:', res.status, err);
      }
    } catch (err) {
      console.error('Failed to send message:', err);
    }
  });
</script>
</body>
</html>
